[build-system]
requires = [
        "setuptools",
        "wheel",
        "cython",
        "numpy",
]

[tool.pycodestyle]
count = false
ignore = "W191,W291,W293,E231,E225"
max-line-length = 160
statistics = false

[tool.pytest.ini_options]
collect_ignore = "['setup.py']"
addopts = "--junitxml=test-reports/junit.xml  --html=tests/reports/index.html"

[tool.pydocstyle]
add-ignore = "D107"

[project.urls]
Homepage = "https://github.com/JohannesBuchner/UltraNest"
Source = "https://github.com/JohannesBuchner/UltraNest"
Documentation = "https://johannesbuchner.github.io/UltraNest/"
